name: Déploiement Supabase

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches: [master]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cette étape tourne aussi sur PR, sans accès aux secrets ni à Supabase hébergé.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le planificateur Versus
        run: |
          bash -n supabase/scheduler/activate.sh
          test -f supabase/scheduler/resolve-due.sql
          grep -Fq "gv-resolve-due" supabase/scheduler/resolve-due.sql

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Vérifier la référence du projet
        run: test -n "$SUPABASE_PROJECT_REF"

      - name: Appliquer les migrations
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase db push --remote="$SUPABASE_PROJECT_REF" --password="$SUPABASE_DB_PASSWORD" --yes

      - name: Déployer les fonctions Edge
        if: hashFiles('supabase/functions/*/index.ts') != ''
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Activer et vérifier le planificateur Versus
        if: hashFiles('supabase/scheduler/activate.sh') != ''
        run: |
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          bash supabase/scheduler/activate.sh
